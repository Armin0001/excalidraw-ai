name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Unit tests only. The LLM evals need API keys and run on demand with `npm run eval`.
      - run: npm test
      # Builds the Worker and the client. No secrets needed.
      - run: npm run build
